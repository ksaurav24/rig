[package]
name = "rig-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rig Desktop — multi-server native control app for Rig"

[lib]
name = "rig_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rig-desktop"
path = "src/main.rs"

[features]
default = []
# Enabled automatically by `tauri build` (and manual release builds) to embed `../dist` instead of connecting to Vite `devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rig-api = { version = "0.1.0", path = "../../../crates/rig-api" }
rig-client = { version = "0.1.0", path = "../../../crates/rig-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v7"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3.27.0"
