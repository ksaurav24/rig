[package]
name = "rig-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bollard = "0.21.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
cliclack = "0.5.7"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rig-api = { version = "0.1.0", path = "../rig-api", features = ["schema"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
subtle = "2.6.1"
sysinfo = "0.40.3"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.2", features = ["v7"] }
zstd = "0.13"

[build-dependencies]
brotli = "9.1.2"
flate2 = "1.1.11"
hex = "0.4.3"
mime_guess = "2.0.5"
sha2 = "0.11.1"
