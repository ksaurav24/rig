[package]
name = "rig-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "rig_cli"
path = "src/lib.rs"

[[bin]]
name = "rig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.12"
cliclack = "0.5.7"
console = "0.16.6"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
ignore = "0.4"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "stream"] }
rig-api = { version = "0.1.0", path = "../rig-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-std", "io-util", "time", "sync", "signal", "process"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "process", "macros", "sync", "time", "io-util"] }
tokio-stream = "0.1.19"
