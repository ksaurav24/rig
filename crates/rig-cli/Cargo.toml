[package]
name = "rig-cli"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rig-api = { version = "0.1.0", path = "../rig-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
toml = "1.2.1"

[[bin]]
name = "rig"
path = "src/main.rs"
