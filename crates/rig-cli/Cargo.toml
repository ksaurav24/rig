[package]
name = "rig-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "rig_cli"
path = "src/lib.rs"

[[bin]]
name = "rig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.12"
console = "0.16.6"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rig-api = { version = "0.1.0", path = "../rig-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util", "time", "sync", "signal"] }
toml = "1.2.1"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "process", "macros", "sync", "time", "io-util"] }
tokio-stream = "0.1.19"
