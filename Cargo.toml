[workspace]
resolver = "3"
members = ["crates/rig-api", "crates/rig-server", "crates/rig-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/rig-sh/rig"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.argon2]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
