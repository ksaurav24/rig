[workspace]
resolver = "3"
members = ["crates/rig-api", "crates/rig-server", "crates/rig-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/rig-sh/rig"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
